<style>

.sentiment-bars { display: flex; gap: 8px; margin-bottom: 14px; }

.insight { background: #1e293b; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.insight-title { font-size: 12px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }

.btn { padding: 11px 22px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; color: white; background: #3b82f6; }

.empty { text-align: center; padding: 36px 20px; }

.status-pill { font-size: 10px; color: #475569; background: #1e293b; padding: 3px 8px; border-radius: 20px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 8px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; }
.bar-lbl { font-size: 8px; color: #94a3b8; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.signout-btn { background: #1e293b; color: #64748b; border: none; border-radius: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
.pipeline-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.pipeline-stat { background: #1e293b; border-radius: 10px; padding: 10px 12px; }
.pipeline-val { font-size: 20px; font-weight: 800; font-family: monospace; }

.sw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

.sw-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }

.emoji-grid { display: flex; gap: 8px; flex-wrap: wrap; }

.emoji-count { font-size: 12px; font-weight: 700; color: #0f172a; font-family: monospace; }

.back-btn { background: #1e293b; color: #94a3b8; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; flex-shrink: 0; }
</style>

<body>
<div id="app">
  <div class="loading">
    <div style="font-size:40px">📡</div>
    <div class="loading-text">ChannelIQ</div>
    <div class="loading-sub">Loading...</div>
  </div>
</div>
<script>
const SUPABASE_URL = "https://ukirtgdeekjzddvgmizs.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVraXJ0Z2RlZWtqemRkdmdtaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1Nzk1NTQsImV4cCI6MjA5NTE1NTU1NH0.jtMsJ7u0oSidFc8A3Iu9BfnuUoqdWOVIvjfBCMp7DXE";
const SERVER = "https://channelliq-server-production.up.railway.app";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  screen:"loading", user:null, channel:null, handle:"",
  videos:[], comments:[], sentiment:null, tab:"overview",
  status:"", busy:false, tier:"bronze", error:"", backgroundData:null,
  goal:"", creatorType:"",
  selectedVideo:null, videoSentiment:null, videoComments:[],
  spamVisible:false
};

const fmt = n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1000?(n/1000).toFixed(1)+"K":String(n||0);
const fmtDur = (iso="")=>{
  const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return "--";
  const h=+(m[1]||0),mn=+(m[2]||0),s=+(m[3]||0);
  return h?`${h}:${String(mn).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${mn}:${String(s).padStart(2,"0")}`;
};
const fmtDate = iso=>new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const getTier = subs=>subs>=100000?"gold":subs>=10000?"silver":"bronze";
const getTierLabel = t=>t==="gold"?"🥇 Gold":t==="silver"?"🥈 Silver":"🥉 Bronze";
const getTierBadgeClass = t=>`tier-badge tier-badge-${t}`;
const isLocked = required=>{ const o=["bronze","silver","gold"]; return o.indexOf(state.tier)<o.indexOf(required); };

// Strip hashtags and clean title
const cleanTitle = t => t.replace(/#\S+/g,"").replace(/\s+/g," ").trim();

async function init() {
  const { data:{ session } } = await sb.auth.getSession();
  const saved = localStorage.getItem("channeliq_handle");
  if (session) {
    state.user=session.user;
    if (saved) { state.handle=saved; state.screen="loading"; render(); await loadChannel(saved); }
    else { state.screen="onboard"; render(); }
  } else {
    if (saved) state.handle=saved;
    state.screen="onboard"; render();
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event==="SIGNED_IN" && session) {
      state.user=session.user;
      const h=localStorage.getItem("channeliq_handle");
      if (state.backgroundData && h) {
        state.channel=state.backgroundData.channel;
        state.videos=state.backgroundData.videos;
        state.tier=getTier(parseInt(state.channel.statistics?.subscriberCount||0));
        state.status=`${state.videos.length} videos loaded ✓`;
        state.screen="dashboard"; state.busy=false; render();
      } else if (h) { state.handle=h; await loadChannel(h); }
      else { state.screen="onboard"; render(); }
    }
    if (event==="SIGNED_OUT") {
      state.user=null; state.channel=null; state.videos=[];
      state.comments=[]; state.sentiment=null; state.screen="onboard";
      localStorage.removeItem("channeliq_handle"); render();
    }
  });
}

async function lookup() {
  const input=document.getElementById("handleInput");
  if (!input) return;
  const handle=input.value.trim();
  if (!handle) return;
  state.handle=handle; state.error=""; state.busy=true; state.screen="loading"; render();
  try {
    const r=await fetch(`${SERVER}/lookup?handle=${encodeURIComponent(handle)}`);
    const d=await r.json();
    if (d.error) { state.error=d.error; state.busy=false; state.screen="onboard"; render(); return; }
    state.channel=d; state.tier=getTier(parseInt(d.statistics?.subscriberCount||0));
    state.screen="teaser"; state.busy=false; render(); fetchBackground();
  } catch(e) { state.error="Connection failed. Please try again."; state.busy=false; state.screen="onboard"; render(); }
}

async function fetchBackground() {
  try {
    const r=await fetch(`${SERVER}/videos?channelId=${state.channel.id}`);
    const d=await r.json();
    state.backgroundData={ channel:state.channel, videos:d.items||[] };
  } catch(_) {}
}

async function signInWithGoogle() {
  if (state.handle) localStorage.setItem("channeliq_handle", state.handle);
  await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:"https://ytanalyst.netlify.app" } });
}

async function signOut() { await sb.auth.signOut(); }

async function loadChannel(handle) {
  state.status="Loading your channel..."; state.screen="loading"; render();
  try {
    const r=await fetch(`${SERVER}/lookup?handle=${encodeURIComponent(handle)}`);
    const d=await r.json();
    if (d.error) throw new Error(d.error);
    state.channel=d; state.tier=getTier(parseInt(d.statistics?.subscriberCount||0));
    const vr=await fetch(`${SERVER}/videos?channelId=${d.id}`);
    const vd=await vr.json();
    state.videos=vd.items||[];
    state.status=`${state.videos.length} videos loaded ✓`;
    state.screen="dashboard"; state.busy=false; render();
  } catch(e) { state.error=e.message; state.screen="onboard"; render(); }
}

async function fetchComments() {
  if (state.busy||!state.videos.length) return;
  state.busy=true;
  const all=[];
  for (const v of state.videos) {
    state.status=`Fetching: ${v.snippet.title.slice(0,25)}...`; render();
    try {
      const r=await fetch(`${SERVER}/comments?videoId=${v.id}`);
      const d=await r.json();
      d.items?.forEach(item=>{
        const top=item.snippet.topLevelComment.snippet;
        all.push({videoId:v.id,videoTitle:v.snippet.title,text:top.textDisplay,likes:top.likeCount,author:top.authorDisplayName});
      });
    } catch(_) {}
  }
  state.comments=all; state.status=`${all.length} comments loaded ✓`; state.busy=false; render();
  if (all.length) runSentiment(all);
}

async function runSentiment(data) {
  const src=data||state.comments;
  if (!src.length) return;
  state.busy=true; state.status="Running AI analysis..."; render();
  try {
    const r=await fetch(`${SERVER}/sentiment`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ comments:src, goal:state.goal||"", creatorType:state.creatorType||"" })
    });
    if (!r.ok) throw new Error(`Error ${r.status}`);
    state.sentiment=await r.json();
    state.status="Analysis complete ✓"; state.tab="sentiment";
  } catch(e) { state.status="AI error: "+e.message; }
  state.busy=false; render();
}

async function openVideo(video) {
  state.selectedVideo=video; state.videoSentiment=null; state.videoComments=[];
  state.screen="videodetail"; render();
  state.busy=true; state.status=`Loading comments...`; render();
  try {
    const r=await fetch(`${SERVER}/comments?videoId=${video.id}`);
    const d=await r.json();
    const comments=[];
    d.items?.forEach(item=>{
      const top=item.snippet.topLevelComment.snippet;
      comments.push({videoId:video.id,videoTitle:video.snippet.title,text:top.textDisplay,likes:top.likeCount,author:top.authorDisplayName});
    });
    state.videoComments=comments;
    state.status=`${comments.length} comments loaded ✓`; state.busy=false; render();
    if (comments.length) {
      state.busy=true; state.status="Running AI analysis..."; render();
      const sr=await fetch(`${SERVER}/sentiment`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ comments, goal:state.goal||"", creatorType:state.creatorType||"" })
      });
      if (sr.ok) { state.videoSentiment=await sr.json(); state.status="Analysis complete ✓"; }
    }
  } catch(e) { state.status="Error: "+e.message; }
  state.busy=false; render();
}

            <div class="video-card-meta">${fmtDate(v.snippet.publishedAt)} · ${fmtDur(v.contentDetails?.duration)} · tap for sentiment →</div>
            <div class="stat-grid">
              <div class="stat-box"><div class="stat-val" style="color:#3b82f6">${fmt(views)}</div><div class="stat-lbl">Views</div></div>
              <div class="stat-box"><div class="stat-val" style="color:#10b981">${fmt(likes)}</div><div class="stat-lbl">Likes</div></div>
              <div class="stat-box"><div class="stat-val" style="color:#f59e0b">${fmt(comms)}</div><div class="stat-lbl">Cmts</div></div>
              <div class="stat-box"><div class="stat-val" style="color:${ec}">${eng}%</div><div class="stat-lbl">Eng</div></div>
            </div>
          </div>
        </div>`;
      }).join("")}`,

    comments:!comments.length?`<div class="empty"><div class="empty-icon">💬</div><div class="empty-title">No comments loaded</div><div class="empty-text">Fetch your comments to view them and run AI analysis.</div><button class="btn" onclick="fetchComments()" ${busy?"disabled":""}>Fetch comments →</button></div>`:`
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:13px;font-weight:700">${comments.length} comments</div><div style="font-size:11px;color:#64748b">Across ${videos.length} videos</div></div>
        ${!sentiment?`<button class="btn" onclick="runSentiment()" ${busy?"disabled":""}>Run AI →</button>`:""}
      </div>
      ${comments.slice(0,50).map(cm=>`<div class="comment-card"><div style="font-size:11px;font-weight:700;color:#3b82f6;margin-bottom:4px">${cm.author}</div><div style="font-size:12px;color:#475569;line-height:1.5;margin-bottom:4px">${cm.text}</div><div style="font-size:10px;color:#94a3b8">${cleanTitle(cm.videoTitle||"").slice(0,50)}</div></div>`).join("")}`,

    sentiment:!sentiment?`<div class="empty"><div class="empty-icon">🤖</div><div class="empty-title">AI Sentiment Analysis</div><div class="empty-text">${comments.length?`${comments.length} comments ready.`:"Fetch comments first."}</div><button class="btn" onclick="${comments.length?"runSentiment()":"fetchComments()"}" ${busy?"disabled":""}>${busy?(comments.length?"Analysing...":"Fetching..."):comments.length?"Run AI analysis →":"Fetch comments first →"}</button></div>`:sentimentBlock(sentiment)+`${isLocked("silver")?`<div class="locked-card" style="height:100px"><div class="card-title">Sentiment over time</div>${lockedOverlay("silver","Sentiment Trends")}</div>`:""}`,
  };

  document.getElementById("app").innerHTML=`
    <div style="min-height:100vh;background:#f1f5f9">
      <div class="topbar">
        <div class="logo"><div class="logo-box">YT</div><span class="logo-text">ChannelIQ</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="${getTierBadgeClass(tier)}">${getTierLabel(tier)}</span>
          ${status?`<span class="status-pill">${status}</span>`:""}
          <div style="text-align:right"><div style="color:#f1f5f9;font-size:11px;font-weight:600">${snip.title||""}</div><div style="color:#475569;font-size:10px">${fmt(subs)} subs</div></div>
          <button class="signout-btn" onclick="signOut()">Sign out</button>
        </div>
      </div>
      <div class="body">
        <div class="banner">
          <div class="banner-label">📡 ${snip.title} — ${getTierLabel(tier)} Tier</div>
          <div class="banner-text">${vidCount} video${vidCount!==1?"s":""} · ${fmt(totViews)} total views · ${fmt(subs)} subscribers.${topVideo?` Top performer: "${cleanTitle(topVideo.snippet.title)}".`:""}${tier==="bronze"?" Upgrade to Silver to unlock advanced insights.":""}</div>
          ${!comments.length&&!busy?`<button class="btn" onclick="fetchComments()">Fetch comments &amp; run AI sentiment →</button>`:""}
          ${busy?`<span style="font-size:13px;color:#94a3b8">${status}</span>`:""}
          ${comments.length&&!busy?`<span style="font-size:13px;color:#10b981;font-weight:600">✓ ${comments.length} comments${sentiment?" · Sentiment ready":""}</span>`:""}
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#64748b;margin-bottom:8px">KPIs</div>
        <div class="kpi-grid">${kpis.map(k=>`<div class="kpi-card" style="border-left:4px solid ${k.color}"><div class="kpi-label">${k.icon} ${k.label}</div><div class="kpi-value" style="color:${k.color}">${k.value}</div><div class="kpi-note">${k.note}</div></div>`).join("")}</div>
        <div class="tabs">${["overview","videos","comments","sentiment"].map(t=>`<button class="tab ${tab===t?"active":""}" onclick="setTab('${t}')">${t}${t==="sentiment"&&sentiment?" ✓":""}</button>`).join("")}</div>
        <div>${tabContent[tab]||""}</div>
      </div>
    </div>`;
}

function render() {
  if (state.screen==="loading") { document.getElementById("app").innerHTML=`<div class="loading"><div style="font-size:40px">📡</div><div class="loading-text">ChannelIQ</div><div class="loading-sub">${state.status||"Loading..."}</div></div>`; return; }
  if (state.screen==="onboard") { renderOnboard(); return; }
  if (state.screen==="teaser") { renderTeaser(); return; }
  if (state.screen==="videodetail") { renderVideoDetail(); return; }
  if (state.screen==="dashboard") { renderDashboard(); return; }
}

init();
</script>
</body>
</html>
