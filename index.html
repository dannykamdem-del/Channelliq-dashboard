<script>
const SUPABASE_URL = "https://ukirtgdeekjzddvgmizs.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVraXJ0Z2RlZWtqemRkdmdtaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1Nzk1NTQsImV4cCI6MjA5NTE1NTU1NH0.jtMsJ7u0oSidFc8A3Iu9BfnuUoqdWOVIvjfBCMp7DXE";
const SERVER = "https://channelliq-server-production.up.railway.app";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  screen:"loading", user:null, channel:null, handle:"",
  videos:[], comments:[], sentiment:null, tab:"overview",
  status:"", busy:false, tier:"bronze", error:"", backgroundData:null,
  goal:"", creatorType:"",
  selectedVideo:null, videoSentiment:null, videoComments:[],
  spamVisible:false, dateRange:"all"
};

const fmt = n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1000?(n/1000).toFixed(1)+"K":String(n||0);
const fmtDur = (iso="")=>{
  const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return "--";
  const h=+(m[1]||0),mn=+(m[2]||0),s=+(m[3]||0);
  return h?`${h}:${String(mn).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${mn}:${String(s).padStart(2,"0")}`;
};
const fmtSecs = s => { const m=Math.floor(s/60),sec=s%60; return `${m}:${String(sec).padStart(2,"0")}`; };
const fmtDate = iso=>new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const getTier = subs=>subs>=100000?"gold":subs>=10000?"silver":"bronze";
const getTierLabel = t=>t==="gold"?"🥇 Gold":t==="silver"?"🥈 Silver":"🥉 Bronze";
const getTierBadgeClass = t=>`tier-badge tier-badge-${t}`;
const isLocked = required=>{ const o=["bronze","silver","gold"]; return o.indexOf(state.tier)<o.indexOf(required); };
const cleanTitle = t=>t.replace(/#\S+/g,"").replace(/\s+/g," ").trim();

// ── DATE RANGE FILTER ────────────────────────────────────────────────────────
function filterVideosByRange(videos, range) {
  if (range==="all") return videos;
  const now = new Date();
  const days = range==="7"?7:range==="30"?30:range==="90"?90:365;
  const cutoff = new Date(now.getTime() - days*24*60*60*1000);
  return videos.filter(v => new Date(v.snippet.publishedAt) >= cutoff);
}

// ── VIDEO DURATION IN SECONDS ─────────────────────────────────────────────────
function durationSecs(iso="") {
  const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return 0;
  return (+(m[1]||0))*3600+(+(m[2]||0))*60+(+(m[3]||0));
}

// ── ADVANCED ANALYTICS CALCULATIONS ──────────────────────────────────────────
function calcAdvanced(videos) {
  if (!videos.length) return null;

  // Total metrics
  const totalViews = videos.reduce((s,v)=>s+parseInt(v.statistics?.viewCount||0),0);
  const totalLikes = videos.reduce((s,v)=>s+parseInt(v.statistics?.likeCount||0),0);
  const totalComments = videos.reduce((s,v)=>s+parseInt(v.statistics?.commentCount||0),0);
  const avgViews = Math.round(totalViews/videos.length);
  const avgEngRate = totalViews?((totalLikes+totalComments)/totalViews*100).toFixed(2):"0.00";

  // Top performer
  const topVideo = [...videos].sort((a,b)=>parseInt(b.statistics?.viewCount||0)-parseInt(a.statistics?.viewCount||0))[0];

  // Best day of week analysis
  const dayBuckets = {Mon:0,Tue:0,Wed:0,Thu:0,Fri:0,Sat:0,Sun:0};
  const dayCounts = {Mon:0,Tue:0,Wed:0,Thu:0,Fri:0,Sat:0,Sun:0};
  const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  videos.forEach(v => {
    const day = dayNames[new Date(v.snippet.publishedAt).getDay()];
    dayBuckets[day] = (dayBuckets[day]||0) + parseInt(v.statistics?.viewCount||0);
    dayCounts[day] = (dayCounts[day]||0) + 1;
  });
  const dayAvgs = Object.entries(dayBuckets).map(([day,total])=>({
    day, avg: dayCounts[day]?Math.round(total/dayCounts[day]):0, count: dayCounts[day]
  })).sort((a,b)=>["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(a.day)-["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(b.day));
  const bestDay = [...dayAvgs].sort((a,b)=>b.avg-a.avg)[0];

  // Video length buckets
  const lengthBuckets = [
    {label:"0–5 min", min:0, max:300},
    {label:"5–10 min", min:300, max:600},
    {label:"10–20 min", min:600, max:1200},
    {label:"20–60 min", min:1200, max:3600},
    {label:"60 min+", min:3600, max:Infinity},
  ];
  const lengthData = lengthBuckets.map(b=>{
    const matching = videos.filter(v=>{ const s=durationSecs(v.contentDetails?.duration); return s>=b.min && s<b.max; });
    const totalV = matching.reduce((s,v)=>s+parseInt(v.statistics?.viewCount||0),0);
    const avgV = matching.length?Math.round(totalV/matching.length):0;
    const avgEng = matching.length?((matching.reduce((s,v)=>s+parseInt(v.statistics?.likeCount||0)+parseInt(v.statistics?.commentCount||0),0)/Math.max(totalV,1))*100).toFixed(1):"0.0";
    return {...b, count:matching.length, avgViews:avgV, avgEng};
  }).filter(b=>b.count>0);

  // Top 5 videos by views with engagement
  const top5 = [...videos]
    .sort((a,b)=>parseInt(b.statistics?.viewCount||0)-parseInt(a.statistics?.viewCount||0))
    .slice(0,5)
    .map(v=>({
      title:cleanTitle(v.snippet.title),
      views:parseInt(v.statistics?.viewCount||0),
      likes:parseInt(v.statistics?.likeCount||0),
      comments:parseInt(v.statistics?.commentCount||0),
      eng:parseInt(v.statistics?.viewCount||0)?((parseInt(v.statistics?.likeCount||0)+parseInt(v.statistics?.commentCount||0))/parseInt(v.statistics?.viewCount||0)*100).toFixed(1):"0.0",
      date:v.snippet.publishedAt,
      dur:v.contentDetails?.duration
    }));

  // Like to view ratio trend (simple: split into halves)
  const sorted = [...videos].sort((a,b)=>new Date(a.snippet.publishedAt)-new Date(b.snippet.publishedAt));
  const half = Math.floor(sorted.length/2);
  const firstHalf = sorted.slice(0,half);
  const secondHalf = sorted.slice(half);
  const calcAvgEng = arr => {
    const v=arr.reduce((s,x)=>s+parseInt(x.statistics?.viewCount||0),0);
    const e=arr.reduce((s,x)=>s+parseInt(x.statistics?.likeCount||0)+parseInt(x.statistics?.commentCount||0),0);
    return v?(e/v*100).toFixed(2):"0.00";
  };
  const engTrend = firstHalf.length&&secondHalf.length ? {
    before:calcAvgEng(firstHalf),
    after:calcAvgEng(secondHalf),
    direction: parseFloat(calcAvgEng(secondHalf))>=parseFloat(calcAvgEng(firstHalf))?"up":"down"
  } : null;

  return { totalViews, totalLikes, totalComments, avgViews, avgEngRate, topVideo, dayAvgs, bestDay, lengthData, top5, engTrend };
}

async function init() {
  const { data:{ session } } = await sb.auth.getSession();
  const saved = localStorage.getItem("channeliq_handle");
  if (session) {
    state.user=session.user;
    if (saved) { state.handle=saved; state.screen="loading"; render(); await loadChannel(saved); }
    else { state.screen="onboard"; render(); }
  } else {
    if (saved) state.handle=saved;
    state.screen="onboard"; render();
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event==="SIGNED_IN" && session) {
      state.user=session.user;
      const h=localStorage.getItem("channeliq_handle");
      if (state.backgroundData && h) {
        state.channel=state.backgroundData.channel;
        state.videos=state.backgroundData.videos;
        state.tier=getTier(parseInt(state.channel.statistics?.subscriberCount||0));
        state.status=`${state.videos.length} videos loaded ✓`;
        state.screen="dashboard"; state.busy=false; render();
      } else if (h) { state.handle=h; await loadChannel(h); }
      else { state.screen="onboard"; render(); }
    }
    if (event==="SIGNED_OUT") {
      state.user=null; state.channel=null; state.videos=[];
      state.comments=[]; state.sentiment=null; state.screen="onboard";
      localStorage.removeItem("channeliq_handle"); render();
    }
  });
}

async function lookup() {
  const input=document.getElementById("handleInput");
  if (!input) return;
  const handle=input.value.trim();
  if (!handle) return;
  state.handle=handle; state.error=""; state.busy=true; state.screen="loading"; render();
  try {
    const r=await fetch(`${SERVER}/lookup?handle=${encodeURIComponent(handle)}`);
    const d=await r.json();
    if (d.error) { state.error=d.error; state.busy=false; state.screen="onboard"; render(); return; }
    state.channel=d; state.tier=getTier(parseInt(d.statistics?.subscriberCount||0));
    state.screen="teaser"; state.busy=false; render(); fetchBackground();
  } catch(e) { state.error="Connection failed. Please try again."; state.busy=false; state.screen="onboard"; render(); }
}

async function fetchBackground() {
  try {
    const r=await fetch(`${SERVER}/videos?channelId=${state.channel.id}`);
    const d=await r.json();
    state.backgroundData={ channel:state.channel, videos:d.items||[] };
  } catch(_) {}
}

async function signInWithGoogle() {
  if (state.handle) localStorage.setItem("channeliq_handle", state.handle);
  await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:"https://ytanalyst.netlify.app" } });
}

async function signOut() { await sb.auth.signOut(); }

async function loadChannel(handle) {
  state.status="Loading your channel..."; state.screen="loading"; render();
  try {
    const r=await fetch(`${SERVER}/lookup?handle=${encodeURIComponent(handle)}`);
    const d=await r.json();
    if (d.error) throw new Error(d.error);
    state.channel=d; state.tier=getTier(parseInt(d.statistics?.subscriberCount||0));
    const vr=await fetch(`${SERVER}/videos?channelId=${d.id}`);
    const vd=await vr.json();
    state.videos=vd.items||[];
    state.status=`${state.videos.length} videos loaded ✓`;
    state.screen="dashboard"; state.busy=false; render();
  } catch(e) { state.error=e.message; state.screen="onboard"; render(); }
}

async function fetchComments() {
  if (state.busy||!state.videos.length) return;
  state.busy=true;
  const all=[];
  for (const v of state.videos) {
    state.status=`Fetching: ${v.snippet.title.slice(0,25)}...`; render();
    try {
      const r=await fetch(`${SERVER}/comments?videoId=${v.id}`);
      const d=await r.json();
      d.items?.forEach(item=>{
        const top=item.snippet.topLevelComment.snippet;
        all.push({videoId:v.id,videoTitle:v.snippet.title,text:top.textDisplay,likes:top.likeCount,author:top.authorDisplayName});
      });
    } catch(_) {}
  }
  state.comments=all; state.status=`${all.length} comments loaded ✓`; state.busy=false; render();
  if (all.length) runSentiment(all);
}

async function runSentiment(data) {
  const src=data||state.comments;
  if (!src.length) return;
  state.busy=true; state.status="Running AI analysis..."; render();
  try {
    const r=await fetch(`${SERVER}/sentiment`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ comments:src, goal:state.goal||"", creatorType:state.creatorType||"" })
    });
    if (!r.ok) throw new Error(`Error ${r.status}`);
    state.sentiment=await r.json();
    state.status="Analysis complete ✓"; state.tab="sentiment";
  } catch(e) { state.status="AI error: "+e.message; }
  state.busy=false; render();
}

async function openVideo(video) {
  state.selectedVideo=video; state.videoSentiment=null; state.videoComments=[];
  state.screen="videodetail"; render();
}

async function runVideoSentiment() {
  const video=state.selectedVideo;
  if (!video||state.busy) return;
  state.busy=true; state.status="Fetching comments..."; render();
  try {
    const r=await fetch(`${SERVER}/comments?videoId=${video.id}`);
    const d=await r.json();
    const comments=[];
    d.items?.forEach(item=>{
      const top=item.snippet.topLevelComment.snippet;
      comments.push({videoId:video.id,videoTitle:video.snippet.title,text:top.textDisplay,likes:top.likeCount,author:top.authorDisplayName});
    });
    state.videoComments=comments;
    if (!comments.length) { state.status="No comments found"; state.busy=false; render(); return; }
    state.status="Running AI analysis..."; render();
    const sr=await fetch(`${SERVER}/sentiment`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ comments, goal:state.goal||"", creatorType:state.creatorType||"" })
    });
    if (sr.ok) { state.videoSentiment=await sr.json(); state.status="Analysis complete ✓"; }
  } catch(e) { state.status="Error: "+e.message; }
  state.busy=false; render();
}

function closeVideo() { state.screen="dashboard"; state.selectedVideo=null; state.videoSentiment=null; state.videoComments=[]; render(); }
function setTab(t) { state.tab=t; render(); }
function setDateRange(r) { state.dateRange=r; render(); }
function toggleSpam() { state.spamVisible=!state.spamVisible; render(); }

      <div class="onboard-logo"><div class="onboard-logo-box">YT</div><span class="onboard-logo-text">ChannelIQ</span></div>
      <div class="onboard-card">
        <div class="onboard-title">Understand your channel</div>
        <div class="onboard-sub">Enter your YouTube handle to see AI-powered insights for free.</div>
        ${state.error?`<div class="onboard-error">${state.error}</div>`:""}
        <label class="onboard-label">Your YouTube handle</label>
        <input class="onboard-input" id="handleInput" placeholder="@yourchannel" value="${state.handle||""}" onkeydown="if(event.key==='Enter')lookup()"/>
        <button class="onboard-btn" onclick="lookup()">Preview my channel →</button>
        <div class="tiers">
          <div class="tier tier-bronze"><div class="tier-name">🥉 Bronze</div><div class="tier-range">0–10k subs</div><div class="tier-range" style="color:#d97706;margin-top:2px">Free</div></div>
          <div class="tier tier-silver"><div class="tier-name">🥈 Silver</div><div class="tier-range">10k–100k</div><div class="tier-range" style="color:#94a3b8;margin-top:2px">£19/mo</div></div>
          <div class="tier tier-gold"><div class="tier-name">🥇 Gold</div><div class="tier-range">100k+ subs</div><div class="tier-range" style="color:#f59e0b;margin-top:2px">£49/mo</div></div>
        </div>
        <div class="onboard-features">
          <div class="onboard-feature"><div class="onboard-feature-icon">📊</div><div class="onboard-feature-text"><strong style="color:#f1f5f9">KPI dashboard</strong> — views, engagement and growth explained in plain English</div></div>
          <div class="onboard-feature"><div class="onboard-feature-icon">🤖</div><div class="onboard-feature-text"><strong style="color:#f1f5f9">AI sentiment analysis</strong> — what your audience loves, hates and wants more of</div></div>
          <div class="onboard-feature"><div class="onboard-feature-icon">📈</div><div class="onboard-feature-text"><strong style="color:#f1f5f9">Growth insights</strong> — actionable recommendations tailored to your channel</div></div>
        </div>
      </div>
    </div>`;
}

function renderTeaser() {
  const ch=state.channel, snip=ch.snippet||{}, st=ch.statistics||{};
  const subs=parseInt(st.subscriberCount||0), views=parseInt(st.viewCount||0);
  const fakeKpis=[
    {label:"Subscribers",value:fmt(subs),color:"#3b82f6",icon:"👥",blur:false},
    {label:"Total Views",value:fmt(views),color:"#10b981",icon:"👁",blur:false},
    {label:"Engagement Rate",value:"4.8%",color:"#06b6d4",icon:"📊",blur:true},
    {label:"Sub Conv. Rate",value:"0.42%",color:"#8b5cf6",icon:"🔄",blur:true},
    {label:"Avg View Duration",value:"5m 12s",color:"#f59e0b",icon:"⏱",blur:true},
    {label:"Top Traffic Source",value:"Search 61%",color:"#ef4444",icon:"🔍",blur:true},
  ];
  document.getElementById("app").innerHTML=`
    <div class="teaser">
      <div class="teaser-topbar">
        <div style="display:flex;align-items:center;gap:8px"><div class="logo-box">YT</div><span style="color:#f1f5f9;font-weight:700;font-size:14px">ChannelIQ</span></div>
        <button class="signout-btn" onclick="state.screen='onboard';render()">← Change channel</button>
      </div>
      <div class="teaser-body">
        <div class="teaser-channel">
          ${snip.thumbnails?.default?.url?`<img class="teaser-avatar" src="${snip.thumbnails.default.url}"/>`:`<div class="teaser-avatar" style="display:flex;align-items:center;justify-content:center;font-size:20px">📺</div>`}
          <div><div class="teaser-name">${snip.title||"Your Channel"}</div><div class="teaser-handle">@${snip.customUrl?.replace("@","")||""} · ${getTierLabel(state.tier)} tier</div></div>
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#64748b;margin-bottom:8px">Your KPIs — sign in to unlock all</div>
        <div class="teaser-kpi-grid">
          ${fakeKpis.map(k=>`<div class="teaser-kpi" style="border-left-color:${k.color}"><div class="teaser-kpi-label">${k.icon} ${k.label}</div><div class="teaser-kpi-value ${k.blur?"blurred":""}" style="color:${k.color}">${k.value}</div></div>`).join("")}
        </div>
        <div class="unlock-banner">
          <div style="font-size:28px;margin-bottom:8px">🔓</div>
          <div class="unlock-title">Your insights are ready</div>
          <div class="unlock-sub">Sign in with Google to unlock your full dashboard — free for ${getTierLabel(state.tier)} channels.</div>
          <button class="google-btn" onclick="signInWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
          </button>
        </div>
        <div class="teaser-preview" style="min-height:160px">
          <div class="teaser-preview-label">🤖 AI Sentiment Analysis</div>
          <div class="blurred" style="color:#cbd5e1;font-size:13px;line-height:1.8">Your audience responds most positively to your tutorial content and production quality. Comment themes show strong demand for more in-depth guides.</div>
          <div class="teaser-preview-overlay"><div class="teaser-preview-lock">🔒 Sign in to see your real sentiment analysis</div></div>
        </div>
        <div class="teaser-preview" style="min-height:120px">
          <div class="teaser-preview-label">📈 Growth Recommendations</div>
          <div class="blurred" style="color:#cbd5e1;font-size:13px;line-height:1.8">Post on Tuesday and Thursday between 6-8pm GMT to maximise your audience reach. Increasing to 2 videos per week could accelerate subscriber growth by an estimated 40%.</div>
          <div class="teaser-preview-overlay"><div class="teaser-preview-lock">🔒 Sign in to unlock your growth plan</div></div>
        </div>
      </div>
    </div>`;
}

function renderVideoDetail() {
  const v=state.selectedVideo;
  if (!v) return;
  const views=parseInt(v.statistics?.viewCount||0);
  const likes=parseInt(v.statistics?.likeCount||0);
  const comms=parseInt(v.statistics?.commentCount||0);
  const eng=views?((likes+comms)/views*100).toFixed(1):"0.0";
  const ec=parseFloat(eng)>5?"#10b981":parseFloat(eng)>2?"#f59e0b":"#94a3b8";
  const thumb=v.snippet.thumbnails?.maxres?.url||v.snippet.thumbnails?.high?.url||v.snippet.thumbnails?.medium?.url||v.snippet.thumbnails?.default?.url||"";
  document.getElementById("app").innerHTML=`
    <div style="min-height:100vh;background:#f1f5f9">
      <div class="topbar">
        <div class="logo"><div class="logo-box">YT</div><span class="logo-text">ChannelIQ</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          ${state.status?`<span class="status-pill">${state.status}</span>`:""}
          <button class="signout-btn" onclick="signOut()">Sign out</button>
        </div>
      </div>
      <div class="body">
        <div class="video-detail-header">
          <button class="back-btn" onclick="closeVideo()">← Back</button>
          <div style="font-size:13px;font-weight:700;color:#0f172a;line-height:1.3">${cleanTitle(v.snippet.title)}</div>
        </div>
        ${thumb?`<img src="${thumb}" style="width:100%;border-radius:14px;margin-bottom:12px;object-fit:cover;max-height:200px;display:block" onerror="this.style.display='none'"/>`:""}
        <div style="font-size:10px;color:#94a3b8;margin-bottom:12px">${fmtDate(v.snippet.publishedAt)} · ${fmtDur(v.contentDetails?.duration)}</div>
        <div class="stat-grid" style="margin-bottom:16px">
          <div class="stat-box"><div class="stat-val" style="color:#3b82f6">${fmt(views)}</div><div class="stat-lbl">Views</div></div>
          <div class="stat-box"><div class="stat-val" style="color:#10b981">${fmt(likes)}</div><div class="stat-lbl">Likes</div></div>
          <div class="stat-box"><div class="stat-val" style="color:#f59e0b">${fmt(comms)}</div><div class="stat-lbl">Comments</div></div>
          <div class="stat-box"><div class="stat-val" style="color:${ec}">${eng}%</div><div class="stat-lbl">Engagement</div></div>
        </div>
        ${state.busy?`<div style="text-align:center;padding:40px 20px"><div style="font-size:28px;margin-bottom:10px">🤖</div><div style="font-size:14px;font-weight:600;color:#0f172a;margin-bottom:6px">${state.status}</div></div>`:`
          ${!state.videoSentiment?`
            <div class="dark-card" style="text-align:center;padding:28px 20px">
              <div style="font-size:28px;margin-bottom:10px">🤖</div>
              <div style="font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:6px">Run AI Sentiment Analysis</div>
              <div style="font-size:12px;color:#64748b;margin-bottom:18px;line-height:1.6">Analyse comments on this video — themes, audience personality, strengths and quick wins.</div>
              <button class="btn" onclick="runVideoSentiment()">Run analysis →</button>
            </div>`:sentimentBlock(state.videoSentiment)}
        `}
      </div>
    </div>`;
}

function renderDashboard() {
  const {channel,videos,comments,sentiment,tab,status,busy,tier,dateRange}=state;
  const st=channel.statistics||{}, snip=channel.snippet||{};
  const subs=parseInt(st.subscriberCount||0), totViews=parseInt(st.viewCount||0), vidCount=parseInt(st.videoCount||0);
  const totLikes=videos.reduce((s,v)=>s+parseInt(v.statistics?.likeCount||0),0);
  const totComms=videos.reduce((s,v)=>s+parseInt(v.statistics?.commentCount||0),0);
  const vidViews=videos.reduce((s,v)=>s+parseInt(v.statistics?.viewCount||0),0);
  const engRate=vidViews?((totLikes+totComms)/vidViews*100).toFixed(2):"0.00";
  const topVideo=[...videos].sort((a,b)=>parseInt(b.statistics?.viewCount||0)-parseInt(a.statistics?.viewCount||0))[0];
  const maxViews=Math.max(...videos.map(v=>parseInt(v.statistics?.viewCount||0)),1);
  const filteredVideos=filterVideosByRange(videos, dateRange);
  const adv=calcAdvanced(filteredVideos);

  const kpis=[
    {label:"Subscribers",value:fmt(subs),color:"#3b82f6",icon:"👥",note:subs<1000?"Consistency and SEO titles are the fastest path to 1,000.":"Solid base. Focus on converting views to subscribers."},
    {label:"Total Views",value:fmt(totViews),color:"#10b981",icon:"👁",note:"Lifetime views. Every video compounds your reach."},
    {label:"Videos",value:vidCount,color:"#f59e0b",icon:"🎬",note:"Aim for 1 video per week minimum to build momentum."},
    {label:"Likes",value:fmt(totLikes),color:"#ef4444",icon:"👍",note:"Above 4% like-to-view ratio is strong."},
    {label:"Comments",value:fmt(totComms),color:"#8b5cf6",icon:"💬",note:"Reply to every comment — doubles the count and builds loyalty."},
    {label:"Engagement",value:engRate+"%",color:"#06b6d4",icon:"📊",note:parseFloat(engRate)>5?"Above average — strong content-audience fit.":"End videos with a direct question to lift this."},
  ];

  const sortedVideos=[...videos].sort((a,b)=>parseInt(b.statistics?.viewCount||0)-parseInt(a.statistics?.viewCount||0));
  const lockedOverlay=(required,feature)=>`<div class="locked-overlay"><div style="font-size:22px">🔒</div><div class="locked-text">${feature}</div><div class="locked-sub">Available on ${required.charAt(0).toUpperCase()+required.slice(1)} tier</div><button class="upgrade-btn">Upgrade to unlock</button></div>`;

  const tabContent={
    overview:`
      <div class="card"><div class="card-title">Views per video</div><div class="bar-chart">${[...videos].sort((a,b)=>new Date(a.snippet.publishedAt)-new Date(b.snippet.publishedAt)).map((v,i,arr)=>{ const views=parseInt(v.statistics?.viewCount||0); const h=Math.max((views/maxViews)*100,2); return`<div class="bar-wrap"><div style="flex:1;display:flex;align-items:flex-end;width:100%"><div class="bar" style="height:${h}%;background:${i===arr.length-1?"#3b82f6":"#bfdbfe"}"></div></div><div class="bar-lbl">${cleanTitle(v.snippet.title).slice(0,10)}</div></div>`; }).join("")}</div></div>
      <div class="dark-card"><div style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#3b82f6;margin-bottom:10px">📋 What your data is telling you</div>${[{t:"Foundation phase",b:`${vidCount} videos is the beginning. Every video trains the algorithm.`},{t:"Engagement beats views",b:"50 views and 10 comments beats 500 views and silence."},{t:"Your blueprint",b:topVideo?`"${cleanTitle(topVideo.snippet.title)}" is your top performer. Study and repeat that formula.`:"Keep publishing — patterns will emerge."},{t:"Run sentiment",b:"Tap 'Fetch comments' to get AI analysis of what your audience loves."}].map(item=>`<div class="insight"><div class="insight-title">${item.t}</div><div class="insight-body">${item.b}</div></div>`).join("")}</div>
      ${isLocked("silver")?`<div class="locked-card" style="height:100px"><div class="card-title">Posting time vs audience insights</div>${lockedOverlay("silver","Posting Time Analysis")}</div>`:""}`,

    videos:`
      <div class="card" style="margin-bottom:12px"><div style="font-size:13px;font-weight:700;margin-bottom:4px">Your videos</div><div style="font-size:11px;color:#64748b">Tap any video for a full breakdown and AI sentiment analysis</div></div>
      ${sortedVideos.map(v=>{ const views=parseInt(v.statistics?.viewCount||0); const likes=parseInt(v.statistics?.likeCount||0); const comms=parseInt(v.statistics?.commentCount||0); const eng=views?((likes+comms)/views*100).toFixed(1):"0.0"; const ec=parseFloat(eng)>5?"#10b981":parseFloat(eng)>2?"#f59e0b":"#94a3b8"; const thumb=v.snippet.thumbnails?.maxres?.url||v.snippet.thumbnails?.high?.url||v.snippet.thumbnails?.medium?.url||v.snippet.thumbnails?.default?.url||""; const safeV=encodeURIComponent(JSON.stringify(v)); return`<div class="video-card" onclick="openVideo(JSON.parse(decodeURIComponent('${safeV}')))">${thumb?`<img src="${thumb}" class="video-thumb-large" onerror="this.style.display='none'"/>`:""}<div class="video-card-body"><div class="video-card-title">${cleanTitle(v.snippet.title)}</div><div class="video-card-meta">${fmtDate(v.snippet.publishedAt)} · ${fmtDur(v.contentDetails?.duration)} · tap for sentiment →</div><div class="stat-grid"><div class="stat-box"><div class="stat-val" style="color:#3b82f6">${fmt(views)}</div><div class="stat-lbl">Views</div></div><div class="stat-box"><div class="stat-val" style="color:#10b981">${fmt(likes)}</div><div class="stat-lbl">Likes</div></div><div class="stat-box"><div class="stat-val" style="color:#f59e0b">${fmt(comms)}</div><div class="stat-lbl">Cmts</div></div><div class="stat-box"><div class="stat-val" style="color:${ec}">${eng}%</div><div class="stat-lbl">Eng</div></div></div></div></div>`; }).join("")}`,

    comments:!comments.length?`<div class="empty"><div class="empty-icon">💬</div><div class="empty-title">No comments loaded</div><div class="empty-text">Fetch your comments to view them and run AI analysis.</div><button class="btn" onclick="fetchComments()" ${busy?"disabled":""}>Fetch comments →</button></div>`:`
      <div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;font-weight:700">${comments.length} comments</div><div style="font-size:11px;color:#64748b">Across ${videos.length} videos</div></div>${!sentiment?`<button class="btn" onclick="runSentiment()" ${busy?"disabled":""}>Run AI →</button>`:""}</div>
      ${comments.slice(0,50).map(cm=>`<div class="comment-card"><div style="font-size:11px;font-weight:700;color:#3b82f6;margin-bottom:4px">${cm.author}</div><div style="font-size:12px;color:#475569;line-height:1.5;margin-bottom:4px">${cm.text}</div><div style="font-size:10px;color:#94a3b8">${cleanTitle(cm.videoTitle||"").slice(0,50)}</div></div>`).join("")}`,

    sentiment:!sentiment?`<div class="empty"><div class="empty-icon">🤖</div><div class="empty-title">AI Sentiment Analysis</div><div class="empty-text">${comments.length?`${comments.length} comments ready.`:"Fetch comments first."}</div><button class="btn" onclick="${comments.length?"runSentiment()":"fetchComments()"}" ${busy?"disabled":""}>${busy?(comments.length?"Analysing...":"Fetching..."):comments.length?"Run AI analysis →":"Fetch comments first →"}</button></div>`:sentimentBlock(sentiment)+`${isLocked("silver")?`<div class="locked-card" style="height:100px"><div class="card-title">Sentiment over time</div>${lockedOverlay("silver","Sentiment Trends")}</div>`:""}`,

    advanced: renderAdvanced(filteredVideos, adv),
  };

  document.getElementById("app").innerHTML=`
    <div style="min-height:100vh;background:#f1f5f9">
      <div class="topbar">
        <div class="logo"><div class="logo-box">YT</div><span class="logo-text">ChannelIQ</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="${getTierBadgeClass(tier)}">${getTierLabel(tier)}</span>
          ${status?`<span class="status-pill">${status}</span>`:""}
          <div style="text-align:right"><div style="color:#f1f5f9;font-size:11px;font-weight:600">${snip.title||""}</div><div style="color:#475569;font-size:10px">${fmt(subs)} subs</div></div>
          <button class="signout-btn" onclick="signOut()">Sign out</button>
        </div>
      </div>
      <div class="body">
        <div class="banner">
          <div class="banner-label">📡 ${snip.title} — ${getTierLabel(tier)} Tier</div>
          <div class="banner-text">${vidCount} video${vidCount!==1?"s":""} · ${fmt(totViews)} total views · ${fmt(subs)} subscribers.${topVideo?` Top performer: "${cleanTitle(topVideo.snippet.title)}".`:""}${tier==="bronze"?" Upgrade to Silver to unlock advanced insights.":""}</div>
          ${!comments.length&&!busy?`<button class="btn" onclick="fetchComments()">Fetch comments &amp; run AI sentiment →</button>`:""}
          ${busy?`<span style="font-size:13px;color:#94a3b8">${status}</span>`:""}
          ${comments.length&&!busy?`<span style="font-size:13px;color:#10b981;font-weight:600">✓ ${comments.length} comments${sentiment?" · Sentiment ready":""}</span>`:""}
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#64748b;margin-bottom:8px">KPIs</div>
        <div class="kpi-grid">${kpis.map(k=>`<div class="kpi-card" style="border-left:4px solid ${k.color}"><div class="kpi-label">${k.icon} ${k.label}</div><div class="kpi-value" style="color:${k.color}">${k.value}</div><div class="kpi-note">${k.note}</div></div>`).join("")}</div>
        <div class="tabs">${["overview","videos","comments","sentiment","advanced"].map(t=>`<button class="tab ${tab===t?"active":""}" onclick="setTab('${t}')">${t==="advanced"?"📊 advanced":t}${t==="sentiment"&&sentiment?" ✓":""}</button>`).join("")}</div>
        <div>${tabContent[tab]||""}</div>
      </div>
    </div>`;
}

function render() {
  if (state.screen==="loading") { document.getElementById("app").innerHTML=`<div class="loading"><div style="font-size:40px">📡</div><div class="loading-text">ChannelIQ</div><div class="loading-sub">${state.status||"Loading..."}</div></div>`; return; }
  if (state.screen==="onboard") { renderOnboard(); return; }
  if (state.screen==="teaser") { renderTeaser(); return; }
  if (state.screen==="videodetail") { renderVideoDetail(); return; }
  if (state.screen==="dashboard") { renderDashboard(); return; }
}

init();
</script>
</body>
</html>
